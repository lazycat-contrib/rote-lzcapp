application:
  subdomain: rote
  public_path:
    - /
  upstreams:
    - location: /
      domain_prefix: backend
      backend: http://rote-backend:3000/

    - location: /
      backend: http://rote-frontend:80/

services:
  rote-postgres:
    # upstream: postgres:17.11
    image: postgres:17.11
    environment:
      - POSTGRES_USER=rote
      - POSTGRES_PASSWORD={{ stable_secret "rote_db_password" }}
      - POSTGRES_DB=rote
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U rote -d rote
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    binds:
      - /lzcapp/var/postgres:/var/lib/postgresql/data

  rote-backend:
    # upstream: rabithua/rote-backend:latest
    image: rabithua/rote-backend:latest
    environment:
      - POSTGRESQL_URL=postgresql://rote:{{ stable_secret "rote_db_password" }}@rote-postgres:5432/rote
    depends_on:
      - rote-postgres
    command: sh -c 'sleep 15 && bun run dist/scripts/runMigrations.js && bun run dist/server.js'

  rote-frontend:
    # upstream: rabithua/rote-frontend:latest
    image: rabithua/rote-frontend:latest
    environment:
      - VITE_API_BASE=https://backend-{{.S.AppDomain}}
    depends_on:
      - rote-backend
